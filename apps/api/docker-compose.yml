services:
  postgres:
    image: postgres:16
    container_name: saidly-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: saidly
      POSTGRES_PASSWORD: saidly
      POSTGRES_DB: saidly
    volumes:
      - saidly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saidly -d saidly']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  saidly-postgres-data:
