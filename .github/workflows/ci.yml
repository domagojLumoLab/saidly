# Runs the same checks a developer runs locally, on a clean machine.
# Every job starts from an empty VM: no node_modules, no .env, nothing that is
# only installed on someone's laptop. That is the point — it catches the class
# of bug that "works on my machine" hides.

name: CI

# --- When this runs -----------------------------------------------------------
# `pull_request` fires on every push to a branch that has an open PR.
# `push: main` covers the merge commit itself.
# Deliberately no `push` for other branches: that would run this twice for
# every commit on a branch that already has a PR open.
on:
  pull_request:
  push:
    branches: [main]

# --- Don't pay for stale runs -------------------------------------------------
# Push three commits in a row and the first two results are worthless.
# Cancel any run still in flight for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# --- Least privilege ----------------------------------------------------------
# Every job gets an automatic GITHUB_TOKEN. This one only reads the code, so
# everything else (pushing commits, opening issues, publishing) stays denied.
# If a malicious dependency ever executes during CI, it cannot write anything.
permissions:
  contents: read

jobs:
  api:
    name: apps/api
    runs-on: ubuntu-latest # Linux runners are the cheapest and fastest.
    timeout-minutes: 10 # Kill a hung job instead of burning an hour.

    # The test suite talks to a real Postgres. GitHub starts this container
    # alongside the job and maps it onto localhost, so the same TEST_DATABASE_URL
    # works here and on a laptop running docker-compose.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saidly
          POSTGRES_PASSWORD: saidly
          POSTGRES_DB: saidly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saidly -d saidly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The package lives in apps/api and there is no package.json at the
    # repository root, so every `run:` step below needs to execute there.
    # NOTE: this applies to `run:` steps ONLY, never to `uses:` steps — an
    # action is someone else's program and takes its directory as an input.
    defaults:
      run:
        working-directory: apps/api

    steps:
      # Clones the repository onto the empty runner. Without this the machine
      # has no code at all. First step of essentially every workflow.
      - name: Check out the repository
        uses: actions/checkout@v7

      # Pinned to an exact version, not the moving @v2 tag: `working-directory`
      # and `require-lockfile` below only exist from v2.1.0, and @v2 still points
      # at v2.0.x. A moving major tag can lag behind its own releases.
      # One action, four jobs: install pnpm, install Node, restore the pnpm
      # store from cache, run `pnpm install` (its `install` input defaults to
      # true). Successor to the older pnpm/action-setup + actions/setup-node pair.
      #
      #   working-directory  `defaults.run` above does not reach a `uses:` step,
      #                      so the action is told where the project is.
      #   (no version)       pnpm's version is read from devEngines.packageManager
      #                      in apps/api/package.json — one source of truth with
      #                      what runs locally.
      #   runtime            Node is explicit because there is no
      #                      devEngines.runtime field; declare one and this
      #                      input can be dropped.
      #   cache              Keeps the downloaded packages between runs
      #                      (~40s install becomes ~5s).
      #   require-lockfile   pnpm already refuses to UPDATE a lockfile in CI, but
      #                      with no lockfile at all it would happily resolve
      #                      fresh versions, write one and exit 0 — silently
      #                      testing different dependencies than we develop
      #                      against. This makes that case fail instead.
      - name: Set up pnpm and Node
        uses: pnpm/setup@v2.1.0
        with:
          working-directory: apps/api
          runtime: node@22
          cache: true
          require-lockfile: true

      # The same three scripts from package.json that we run locally — not
      # special "CI versions". If CI ran something else, the two would drift.
      # Steps run in order and the first failure ends the job, so lint errors
      # surface before the slower checks.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Catches a broken production build here rather than at deploy time,
      # where the app is already being replaced.
      - name: Build
        run: pnpm build

      # Vitest global setup creates the test database on that service and applies
      # the migrations before the suite runs.
      - name: Test
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://saidly:saidly@localhost:5432/saidly_test

  mobile:
    name: apps/mobile
    runs-on: ubuntu-latest # No iOS build here: that needs a macOS runner, which
                           # costs ten times as much per minute. Analysis and
                           # the widget tests run fine on Linux, and the thing
                           # a mac would catch — signing, pods, plists — is
                           # caught by building on a laptop before release.
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Pinned to an exact version for the same reason as the SDK on a laptop:
      # a Flutter upgrade should be a commit we can see and revert, not
      # something that happens to CI one morning. Keep this in step with
      # `flutter --version` locally.
      #
      #   cache  Keeps the SDK between runs. Downloading it is ~1.5 minutes.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Checks formatting without rewriting anything, so a badly formatted file
      # fails the PR instead of being quietly fixed by whoever runs the tool
      # next and showing up in an unrelated diff.
      - name: Format
        run: dart format --set-exit-if-changed lib test

      # `dart analyze --fatal-infos`, NOT `flutter analyze`. Both halves matter
      # and both were measured — see the header of apps/mobile/analysis_options.yaml.
      # Only `dart analyze` loads analyzer plugins, so `flutter analyze` skips
      # every riverpod_lint rule and reports a clean project; and `dart analyze`
      # exits 0 on info-level issues, which is most of flutter_lints, so without
      # the flag `avoid_print` would report and still pass.
      - name: Analyze
        run: dart analyze --fatal-infos

      # No build_runner step: the generated *.g.dart files are committed, so a
      # fresh clone builds without codegen. The trade is that nothing here
      # catches an @riverpod class edited without regenerating; that shows up
      # as a compile error in this test step, which is good enough.
      - name: Test
        run: flutter test
